  <!-- Termine -->
  <circle cx="12" cy="12" r="8.5"/>
  <path d="m8.25 12.25 2.5 2.5 5-5.5"/>
</symbol>

<symbol id="mk-slash-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Annule -->
  <circle cx="12" cy="12" r="8.5"/>
  <path d="m6.5 6.5 11 11"/>
</symbol>

<symbol id="mk-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
