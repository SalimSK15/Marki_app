  <path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H8"/>
  <path d="m7.5 5.5-3.5 3.5 3.5 3.5"/>
</symbol>

<symbol id="mk-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
  <circle cx="12" cy="12" r="2.75"/>
</symbol>

<symbol id="mk-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 6.4A11.7 11.7 0 0 0 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.6-1.2"/>
  <path d="M9.9 5.8A10.6 10.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17.9 17.9 0 0 1-2.9 3.9"/>
  <path d="M10.1 10.1a2.75 2.75 0 0 0 3.8 3.8"/>
  <path d="m4 4 16 16"/>
</symbol>

<symbol id="mk-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M16.2 4.3a2.1 2.1 0 0 1 3 3L9 17.5l-4 1 1-4Z"/>
  <path d="m14.5 6 3 3"/>
</symbol>

<symbol id="mk-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.5 7h15"/>
  <path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/>
  <path d="M6.5 7v12A1.5 1.5 0 0 0 8 20.5h8a1.5 1.5 0 0 0 1.5-1.5V7"/>
  <path d="M10.5 11v5.5"/><path d="M13.5 11v5.5"/>
</symbol>

<!-- ============ INTERFACE ============ -->

<symbol id="mk-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
