<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
<!--
  MARKI — jeu d'icones unifie
  ============================================================
  Un seul langage visuel pour toute l'application :
    - grille 24 x 24
    - trait uniquement (aucun aplat), epaisseur 1.75
    - extremites et jonctions arrondies
    - couleur heritee du texte via currentColor

  Remplace : les PNG recolores au filtre CSS, les SVG d'origines
  diverses et les caracteres typographiques (X, ✓, ⌾, ⊘, ↩)
  utilises comme icones, qui changeaient d'aspect selon l'appareil.

  Usage :  <svg class="mk-icon"><use href="#mk-check"></use></svg>
  Le sprite est injecte en debut de <body> : aucune requete reseau,
  et currentColor fonctionne partout.
  ============================================================
-->
<defs>
  <g id="mk-defs-base" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round"></g>
</defs>

<!-- ============ NAVIGATION ============ -->

<symbol id="mk-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Liste du jour : une planchette avec des lignes cochees -->
  <path d="M9 3h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
  <path d="M16 4.5h1.5A1.5 1.5 0 0 1 19 6v13.5A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5V6a1.5 1.5 0 0 1 1.5-1.5H8"/>
  <path d="m8.5 11.5 1.4 1.4 2.6-2.6"/>
  <path d="M15 11.5h1.2"/>
  <path d="m8.5 16.5 1.4 1.4 2.6-2.6"/>
  <path d="M15 16.5h1.2"/>
</symbol>

<symbol id="mk-patients" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Mes patients : deux personnes -->
  <circle cx="9.5" cy="8" r="3.25"/>
  <path d="M3.5 20a6 6 0 0 1 12 0"/>
  <path d="M16.5 5.2a3.25 3.25 0 0 1 0 5.6"/>
  <path d="M17.8 14.5A6 6 0 0 1 20.5 20"/>
</symbol>

<symbol id="mk-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Toutes les listes : journees empilees -->
  <rect x="3.5" y="4" width="17" height="4" rx="1.25"/>
  <path d="M5 8v10.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V8"/>
  <path d="M10 12h4"/>
</symbol>

<symbol id="mk-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Parametres : reglages a curseurs, plus lisible qu'un engrenage -->
  <path d="M5 6h14"/><path d="M5 12h14"/><path d="M5 18h14"/>
  <circle cx="9" cy="6" r="2"/>
  <circle cx="15" cy="12" r="2"/>
  <circle cx="9" cy="18" r="2"/>
</symbol>

<!-- ============ ACTIONS PATIENT ============ -->

<symbol id="mk-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10" cy="8" r="3.5"/>
  <path d="M3.5 20a6.5 6.5 0 0 1 13 0"/>
  <path d="M18.5 7.5v5"/><path d="M16 10h5"/>
</symbol>

<symbol id="mk-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="8" r="3.5"/>
  <path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>
</symbol>

<symbol id="mk-user-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"
