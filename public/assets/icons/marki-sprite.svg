  <!-- Absent -->
  <circle cx="10" cy="8" r="3.5"/>
  <path d="M3.5 20a6.5 6.5 0 0 1 12.2-3.2"/>
  <path d="m17 15.5 4 4"/><path d="m21 15.5-4 4"/>
</symbol>

<symbol id="mk-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
